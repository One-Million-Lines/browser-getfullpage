<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GetFullPage</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <img src="../icons/icon-32.png" width="20" height="20" alt="" />
      <span>GetFullPage</span>
    </div>
    <div class="options">
      <button id="btnFullPage" class="option-btn" type="button">
        <div class="option-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M2 7h18" stroke="currentColor" stroke-width="1.4"/>
            <path d="M7 11h8M7 14.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="option-text">
          <div class="option-title">Full page screenshot</div>
          <div class="option-desc">Capture the entire scrollable page</div>
        </div>
        <svg class="option-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="btnViewport" class="option-btn" type="button">
        <div class="option-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
            <rect x="2" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7 18v2M15 18v2M5 20h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M7 9h8M7 12.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="option-text">
          <div class="option-title">Visible area</div>
          <div class="option-desc">Capture only what's on screen now</div>
        </div>
        <svg class="option-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
