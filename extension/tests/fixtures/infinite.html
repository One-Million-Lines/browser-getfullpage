<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Infinite scroll fixture</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .item { height: 150px; padding: 16px; border-bottom: 1px solid #e2e8f0; }
      .item:nth-child(3n) { background: #f8fafc; }
    </style>
  </head>
  <body id="content"></body>
  <script>
    // Appends content forever as the user nears the bottom. GetFullPage must stop
    // at the configured max height/slices and mark the result truncated (spec §5.5).
    const body = document.getElementById('content');
    let n = 0;
    function add(count) {
      for (let i = 0; i < count; i++) {
        n += 1;
        const d = document.createElement('div');
        d.className = 'item';
        d.textContent = `Infinite item ${n}`;
        body.appendChild(d);
      }
    }
    add(40);
    window.addEventListener('scroll', () => {
      if (window.scrollY + window.innerHeight > document.body.scrollHeight - 600) add(40);
    });
  </script>
</html>
