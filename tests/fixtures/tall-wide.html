<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Tall &amp; wide fixture</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      /* Wider than the viewport to exercise layout-viewport width capture (spec §5.3). */
      .grid { width: 2200px; }
      .row { height: 240px; display: flex; }
      .cell { flex: 1; display: grid; place-items: center; color: #fff; font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script>
      const grid = document.getElementById('grid');
      const colors = ['#0ea5e9', '#6366f1', '#ec4899', '#f97316'];
      for (let r = 0; r < 25; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let c = 0; c < 4; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.style.background = colors[(r + c) % colors.length];
          cell.textContent = `${r + 1},${c + 1}`;
          row.appendChild(cell);
        }
        grid.appendChild(row);
      }
    </script>
  </body>
</html>
