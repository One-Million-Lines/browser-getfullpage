<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Nested scroll container fixture</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      /* The document itself cannot scroll; an inner container is the scroll root. */
      #app { height: 100vh; display: flex; flex-direction: column; }
      #bar { height: 50px; background: #4f46e5; color: #fff; display: flex; align-items: center; padding: 0 16px; }
      #scroller { flex: 1; overflow-y: auto; }
      .block { height: 220px; padding: 16px; border-bottom: 1px solid #e2e8f0; }
      .block:nth-child(even) { background: #f1f5f9; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">Fixed app bar — content scrolls in the panel below</div>
      <div id="scroller"></div>
    </div>
    <script>
      const s = document.getElementById('scroller');
      for (let i = 1; i <= 25; i++) {
        const d = document.createElement('div');
        d.className = 'block';
        d.textContent = `Scroller block ${i}`;
        s.appendChild(d);
      }
    </script>
  </body>
</html>
