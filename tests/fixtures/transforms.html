<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Transforms &amp; scroll-snap fixture</title>
    <style>
      html { scroll-behavior: smooth; scroll-snap-type: y proximity; }
      body { margin: 0; font-family: system-ui, sans-serif; }
      .panel { height: 100vh; scroll-snap-align: start; display: grid; place-items: center; font-size: 30px; color: #fff; }
      .panel:nth-child(1) { background: #ef4444; }
      .panel:nth-child(2) { background: #f59e0b; }
      .panel:nth-child(3) { background: #10b981; }
      .panel:nth-child(4) { background: #3b82f6; }
      .tilt { transform: rotate(-3deg) translateY(10px); background: rgba(0,0,0,0.15); padding: 12px 20px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <section class="panel"><span class="tilt">Panel 1 (transformed label)</span></section>
    <section class="panel"><span class="tilt">Panel 2</span></section>
    <section class="panel"><span class="tilt">Panel 3</span></section>
    <section class="panel"><span class="tilt">Panel 4</span></section>
  </body>
</html>
